[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "msot"
version = "0.1.0"
description = "Sparse multiscale discrete optimal transport with shielding neighbourhoods"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "highspy"]

[project.optional-dependencies]
reference = ["POT"]
cplex = ["cplex", "docplex"]

[tool.setuptools.packages.find]
where = ["src"]
